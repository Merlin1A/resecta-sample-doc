[project]
name = "resecta-sample-doc"
version = "0.1.0"
description = "Deterministic synthetic test-document generators for the Resecta iOS app"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jesse Brookins" }]
dependencies = [
    "fonttools>=4.63.0",
    "opentype-feature-freezer>=1.32.2",
    "pypdf==5.1.0",
    "reportlab==4.2.5",
    "pymupdf>=1.24",   # packet variants: PDF -> raster (scan-sim / degrade ladder)
    "pillow>=10",      # packet variants: image degrade transforms
    "numpy>=2",        # packet variants: the seeded noise rung (an integer SplitMix64 stream)
]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "ruff==0.15.12",
]
# Harness tooling for the oracle / registration legs (tools/verify_oracle.py scan, tools/register_capture.py);
# opt in with `uv sync --group harness`. Not needed to build or verify the packet itself.
harness = [
    "opencv-python-headless>=5,<6",
    "numpy>=2",
    "augraphy==8.2.6",
    "albumentations==2.0.8",
    "pdfplumber",
    "pypdfium2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint subset
    "RUF", # ruff-specific
    "TID", # tidy imports
    "PTH", # use pathlib
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # implicit string concat
    "T20", # no print
    "RET", # flake8-return
    "ERA", # eradicate commented-out code
]
ignore = [
    "ISC001",  # conflicts with formatter
    "E501",    # draw calls and data tables carry long trailing comments by design; the formatter governs code lines
    "PLR2004", # layout coordinates and acceptance counts are literal by design
    "PLR0913", # draw helpers take many geometry arguments
    "PLR0912", # exhibit draw functions are long linear sequences
    "PLR0915", # exhibit draw functions are long linear sequences
    "PLC0415", # lazy imports keep the raster-only dependencies out of the packet build path
    "TID252",  # package-relative imports are the packet's convention
]

[tool.ruff.lint.per-file-ignores]
# Entry points report to stdout by design.
"generate_statement.py" = ["T20"]
"prepare_fonts.py" = ["T20", "S603", "S108", "S310"]
"verify.py" = ["T20", "S603", "S607"]
"statement_data.py" = ["T20"]
"packet/build_packet.py" = ["T20"]
"packet/acceptance.py" = ["T20"]
"packet/variants.py" = ["T20"]
"packet/aruco.py" = ["T20"]
"packet/build_capture.py" = ["T20"]
"packet/fuzz.py" = ["T20"]
"packet/robustness.py" = ["T20"]
# t23's fixture self-checks are asserts by design (a failed premise aborts the family build).
"packet/t23.py" = ["T20", "S101"]
"tools/build_planted_corpus.py" = ["T20", "S603", "S607"]
"tools/build_search_queries.py" = ["T20"]
"tools/register_capture.py" = ["T20", "S603", "S607"]
"tools/search_oracle.py" = ["T20", "S603", "S607"]
"tools/verify_oracle.py" = ["T20", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = false
show_error_codes = true
files = ["."]
exclude = ["\\.venv/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "fitz.*", "pymupdf.*", "pypdf.*", "fontTools.*", "PIL.*", "pypdfium2.*", "cv2.*"]
ignore_missing_imports = true